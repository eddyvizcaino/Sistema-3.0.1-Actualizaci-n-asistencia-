{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block content %}
<div class="panel">
  <form method="post">
    {{ csrf() }}
    <div class="field"><label for="current">Actual</label><input id="current" type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label for="new">Nueva (mínimo 8)</label><input id="new" type="password" name="new" minlength="8" required autocomplete="new-password"></div>
    <button class="btn save">ACTUALIZAR</button>
  </form>
</div>
{% endblock %}
