{% extends 'base.html' %}
{% block content %}<div class="panel"><p>Los miembros eliminados conservan su historial y su cédula reservada.</p>
{% for m in rows %}<p><a href="{{ url_for('members.member_profile', i=m['Id']) }}">{{ m['FullName'] }}</a> · {{ m['DeletedAt'] }}</p><form method="post" action="{{ url_for('members.restore', i=m['Id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn save">RESTAURAR</button></form>{% else %}<p>La papelera está vacía.</p>{% endfor %}</div>{% endblock %}
