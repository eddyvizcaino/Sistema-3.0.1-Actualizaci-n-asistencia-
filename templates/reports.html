{% extends 'base.html' %}{% block content %}<div class="panel"><h2>Reportes PDF y Excel</h2><p><a class="btn save" href="{{ url_for('reports.attendance_dashboard') }}">Panel de asistencia y seguimiento pastoral</a></p><p>Seleccione los filtros que necesite. Las fechas corresponden al ingreso del miembro.</p><form method="get"><div class="grid2"><div class="field"><label>Ministerio</label><select name="ministry"><option value="">Todos</option>{% for m in ministries %}<option value="{{ m.Id }}">{{ m.Name }}</option>{% endfor %}</select></div><div class="field"><label>Estado</label><select name="status"><option value="">Todos</option>{% for s in ['Activo','Inactivo','En seguimiento','Trasladado'] %}<option>{{ s }}</option>{% endfor %}</select></div><div class="field"><label>Bautismo</label><select name="baptized"><option value="">Todos</option><option value="1">Bautizados</option><option value="0">Sin fecha de bautizo</option></select></div><div class="field"><label>Edad mínima</label><input name="min_age" type="number" min="0"></div><div class="field"><label>Edad máxima</label><input name="max_age" type="number" min="0"></div><div class="field"><label>Ingreso desde</label><input name="from" type="date"></div><div class="field"><label>Ingreso hasta</label><input name="to" type="date"></div></div><div class="actions"><button class="btn save" formaction="{{ url_for('reports.report_xlsx') }}">Descargar Excel</button><button class="btn cancel" formaction="{{ url_for('reports.report_pdf') }}">Descargar PDF</button><a class="btn cancel" href="{{ url_for('reports.complete_xlsx') }}">Reporte completo Excel</a><a class="btn save" href="{{ url_for('conversions.conversions') }}">Reporte de conversiones</a><a class="btn save" href="{{ url_for('reports.baptisms') }}">Bautizados</a></div></form></div>{% endblock %}
