{% extends 'base.html' %}{% block content %}<div class="panel"><h2>Expediente {{ s.Code }}</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field,label in [('FullName','Nombre completo'),('Phone','Teléfono'),('Congregation','Congregación'),('Notes','Observaciones')] %}<div class="field"><label>{{ label }}</label><input name="{{ field }}" value="{{ s[field] or '' }}" {{ 'required' if field=='FullName' }}></div>{% endfor %}<div class="field"><label>Estado</label><select name="Status">{% for status in ['Activo','Inactivo','Graduado'] %}<option {{ 'selected' if status==s.Status }}>{{ status }}</option>{% endfor %}</select></div><button class="btn save">Guardar cambios</button></form></div>{% endblock %}
