{% extends 'base.html' %}
{% block content %}
<div class="panel">
  <form method="get">
    <div class="grid2">
      <div class="field"><label for="user">Usuario</label>
        <select id="user" name="user"><option value="">Todos</option>
          {% for u in users %}<option {% if user == u['Username'] %}selected{% endif %}>{{ u['Username'] }}</option>{% endfor %}
        </select></div>
      <div class="field"><label for="day">Fecha</label><input id="day" type="date" name="day" value="{{ day }}"></div>
    </div>
    <button class="btn save">FILTRAR</button>
  </form>
  <table>
    <tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th></tr>
    {% for r in rows %}
    <tr><td>{{ r['CreatedAt'] }}</td><td>{{ r['Username'] or 'Sistema' }}</td><td>{{ r['Action'] }}</td><td>{{ r['Entity'] }}</td><td>{{ r['Details'] or '' }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
